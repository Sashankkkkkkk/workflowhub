name: CI

# Runs on every push and on every pull request into main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Non-secret CI configuration. Real secrets (e.g. registry tokens) belong in
  # Settings -> Secrets and variables -> Actions and are read via ${{ secrets.NAME }}.
  DJANGO_SECRET_KEY: ci-only-not-a-real-secret
  DJANGO_DEBUG: "false"
  VITE_API_URL: http://localhost:8000/api

jobs:
  backend:
    name: Backend - test and Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (pip + requirements.txt)
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Django tests
        working-directory: backend
        run: python manage.py test

      - uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: workflowhub-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke-test the backend container
        run: |
          docker run -d --name backend -p 8000:8000 \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            workflowhub-backend:${{ github.sha }}
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/api/health/ && exit 0
            sleep 2
          done
          docker logs backend
          exit 1

  frontend:
    name: Frontend - test and Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: workflowhub-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
